[workspace]
members = ["crates/hotcoco", "crates/hotcoco-cli", "crates/hotcoco-pyo3"]
resolver = "3"

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Derek Allman <derek.allman@yahoo.com>"]
license = "MIT"
repository = "https://github.com/derekallman/hotcoco"
homepage = "https://derekallman.github.io/hotcoco/"
readme = "README.md"
keywords = ["coco", "object-detection", "evaluation", "computer-vision", "segmentation"]
categories = ["computer-vision", "science"]

# Internal path dependencies. These carry a version because crates.io resolves it
# for published builds, and it does NOT inherit from [workspace.package] above —
# so both entries must be bumped alongside it. They live here, next to the version
# they must match, because when they sat in the member manifests they silently
# lagged a full release behind (0.4.0 throughout 0.4.1). `hotcoco-core` is the
# alias hotcoco-pyo3 needs to avoid colliding with the `hotcoco` Python module
# name; a member cannot rename an inherited dependency, so it is declared here.
[workspace.dependencies]
hotcoco = { version = "1.2.0", path = "crates/hotcoco" }
hotcoco-core = { version = "1.2.0", path = "crates/hotcoco", package = "hotcoco" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Safety
unwrap_used = "warn"
dbg_macro = "deny"
# Pedantic — catch real issues, allow common false positives
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Domain-specific: coco_gt/coco_dt, t/r/k/a/m dimensions are standard COCO terminology
similar_names = "allow"
many_single_char_names = "allow"
# Style preferences that don't catch bugs
doc_markdown = "allow"
doc_link_with_quotes = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
# Intentional in eval code matching pycocotools behavior
float_cmp = "allow"
# Noisy with little benefit for this codebase
uninlined_format_args = "allow"
single_match_else = "allow"
if_not_else = "allow"
implicit_hasher = "allow"
struct_field_names = "allow"
manual_let_else = "allow"
cast_possible_wrap = "allow"
needless_pass_by_value = "allow"
unreadable_literal = "allow"

# Profiles -----------------------------------------------------------------

[profile.dist-release]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

# `split-debuginfo` and `debug` are set explicitly because Cargo's macOS defaults
# make `target/` grow without bound. The default is `split-debuginfo = "unpacked"`
# with full debug info: every compilation unit leaves a loose `.o` file in
# `target/debug/deps/`, and Cargo never garbage-collects them — each rebuild emits
# a freshly-hashed set and the old ones stay forever. The pre-commit hook runs
# `cargo test`, so every commit deposited a few thousand more. It reached 87,134
# object files / 18 GB before anyone looked.
#
# `packed` hands the objects to `dsymutil`, which consumes them into one `.dSYM`
# bundle per binary. `line-tables-only` keeps `file:line` in panic backtraces —
# what you actually read when a test fails — and drops the variable and type info
# only an interactive debugger uses. If you need to step through code in lldb,
# override for that session: `RUSTFLAGS="-Cdebuginfo=2" cargo test`.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.test]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "packed"
