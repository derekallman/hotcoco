[package]
name = "hotcoco"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["AGENTS.md", "CLAUDE.md"]
description = "Perception evaluation in pure Rust — a pycocotools-compatible COCO/LVIS/Open Images engine, panoptic, semantic segmentation, and tracking metrics, diagnostics and dataset tools"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
quick-xml = "0.41"
rayon = "1"
rand = "0.9"
thiserror = "2"
memchr = "2.8.3"
rustc-hash = "2"
png = "0.18.1"
# Image sizes for the converters' `images_dir`, read from each file's header:
# the formats `convert::IMAGE_EXTENSIONS` names, plus the ones Pillow also read
# when one sits under such an extension. Formats Pillow does not read stay off,
# and so do those whose weak magic would size a file that is no image.
imagesize = { version = "0.15.0", default-features = false, features = ["bmp", "dds", "gif", "ico", "jpeg", "png", "pnm", "psd", "qoi", "tga", "tiff", "webp"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
