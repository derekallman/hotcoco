[package]
name = "hotcoco"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["AGENTS.md", "CLAUDE.md"]
description = "Perception evaluation in pure Rust — a pycocotools-compatible COCO/LVIS/Open Images engine with diagnostics and dataset tools"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
quick-xml = "0.41"
rayon = "1"
rand = "0.9"
thiserror = "2"
memchr = "2.8.3"
rustc-hash = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# 1.2 adds `Error::UnknownCategoryIds` on purpose (see CHANGELOG). The check
# compares against the newest published version, 1.1.0, so until 1.2.0 ships
# it reports that change; this block turns exactly that finding into a
# warning, and the summary then reads "no semver update required" even though
# a break is in the tree. Delete the whole block in the commit that bumps the
# version: `semver_override_expires_with_1_1_0` in tests/architecture.rs fails
# the build if it survives the bump.
[package.metadata.cargo-semver-checks.lints]
enum_variant_added = "warn"
