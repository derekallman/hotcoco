[package]
name = "hotcoco"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Perception evaluation in pure Rust — a pycocotools-compatible COCO/LVIS/Open Images engine with diagnostics and dataset tools"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
quick-xml = "0.41"
rayon = "1"
rand = "0.9"
thiserror = "2"
memchr = "2.8.3"
rustc-hash = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# 1.1 makes `COCOeval::coco_gt`/`coco_dt` private, removes the dead
# `Error::JsonParse` variant and adds `Error::UnknownAnnIds`, and marks
# `Segmentation` `#[non_exhaustive]` on purpose (see CHANGELOG). The check
# compares against the newest published version, 1.0.1, so until 1.1.0 ships
# it reports those changes; this block turns exactly those findings into
# warnings, and the summary then reads "no semver update required" even
# though a break is in the tree. Delete the
# whole block in the commit that bumps the version:
# `semver_override_expires_with_1_0_1` in tests/architecture.rs fails the
# build if it survives the bump.
[package.metadata.cargo-semver-checks.lints]
struct_pub_field_missing = "warn"
struct_pub_field_now_doc_hidden = "warn"
enum_variant_missing = "warn"
enum_variant_added = "warn"
enum_marked_non_exhaustive = "warn"
