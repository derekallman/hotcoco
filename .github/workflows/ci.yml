name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable so `release.yml` can gate publishing on it — a tag previously went
  # straight to crates.io and PyPI with nothing run.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned channel + components from rust-toolchain.toml so CI and
      # local development use the identical rustc/clippy version. cache: false
      # (Swatinem handles caching below); rustflags: "" so the action does not
      # inject -D warnings into every build (clippy passes -D warnings itself).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Installed as a prebuilt binary rather than via EmbarkStudios/cargo-deny-action,
      # which is a *Docker* action. GitHub builds every Docker action during job
      # setup — before the first step runs — so a Docker Hub blip killed the whole
      # job (no checkout, no clippy, no tests) and reported it as a CI failure.
      # Reordering steps would not have helped; the Docker dependency had to go.
      - name: Install cargo-deny
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Dependency audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny check

      - name: Tests
        run: cargo test -p hotcoco -p hotcoco-cli

      # The 1.0 reorganization moves nearly every type between modules while
      # promising the crate-root paths keep resolving. Reading lib.rs is not
      # enough to verify that — during the `quality/` move, the crate-root
      # re-exports all still resolved while `hotcoco::types::SummaryStats` had
      # silently stopped existing. Only this caught it.
      #
      # Compares against the newest release on crates.io, so it is ubuntu-only
      # (one baseline download is plenty) and needs no pinned fixture.
      #
      # The baseline is deliberately not pinned. cargo-semver-checks only fails
      # when the version bump is too small for the API change, so pinning an old
      # baseline silently disables it: against a pinned 0.5.0, every release from
      # 1.0.0 onward reads as a major bump, which permits any removal — the run
      # reports success after executing zero checks. Letting it track the latest
      # published version keeps the comparison a patch/minor one, which is where
      # the checks actually run. Mirrors `just semver`.
      - name: Install cargo-semver-checks
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: Public API check
        if: matrix.os == 'ubuntu-latest'
        run: cargo semver-checks check-release -p hotcoco

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # Hook versions and file scopes are defined in .pre-commit-config.yaml.
      - name: Ruff format check
        run: uvx pre-commit run ruff-format --all-files

      - name: Ruff lint
        run: uvx pre-commit run ruff-check --all-files

  python:
    name: Python smoke test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared by requires-python and by the abi3-py39
        # wheel, which is a single wheel served to every Python >= 3.9. Testing
        # the floor catches syntax that only parses on newer interpreters (e.g.
        # PEP 604 `X | Y` unions in evaluated annotations).
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          # pycocotools and lvis are the references the differential suites compare
          # against. Without them, CI's only correctness check was a length
          # assertion, which cannot catch a wrong number. matplotlib is the `plot`
          # extra: the provenance and theme tests import `hotcoco.plot`.
          pip install maturin numpy pytest pycocotools lvis matplotlib

      # Built from the repo root, where pyproject.toml's `python-source` pulls in
      # the pure-Python package. Building inside crates/hotcoco-pyo3 produces a
      # bare extension wheel with no `hotcoco.plot`, `cli`, or `integrations` —
      # the 1.0.0 tag failed its own gate on exactly that, after CI had been
      # green for months against a package nobody installs.
      - name: Build Python package
        run: |
          source .venv/bin/activate
          maturin build --release --out dist
          pip install dist/*.whl

      - name: Smoke test
        run: |
          source .venv/bin/activate
          python -c "
          import hotcoco
          import json, os

          fixtures = 'crates/hotcoco/tests/fixtures'
          gt_path = os.path.join(fixtures, 'gt.json')
          dt_path = os.path.join(fixtures, 'dt.json')

          coco_gt = hotcoco.COCO(gt_path)
          coco_dt = coco_gt.loadRes(dt_path)

          coco_eval = hotcoco.COCOeval(coco_gt, coco_dt, 'bbox')
          coco_eval.evaluate()
          coco_eval.accumulate()
          coco_eval.summarize()

          stats = coco_eval.stats
          assert len(stats) == 12, f'Expected 12 metrics, got {len(stats)}'
          assert any(s > 0 for s in stats), 'Expected some positive metrics'
          print('Smoke test passed!')
          "

      # The differential suites. Both are fully synthetic — they build datasets in
      # tempfiles — so they need no `data/` and run anywhere. Real-data parity
      # (`just parity`) still cannot run here because `data/` is gitignored, but
      # these compare hotcoco against pycocotools and lvis-api metric by metric,
      # which is the thing CI previously did not do at all.
      - name: Differential parity vs pycocotools
        run: |
          source .venv/bin/activate
          pytest scripts/test_parity.py -q

      - name: Differential parity vs lvis-api
        run: |
          source .venv/bin/activate
          .venv/bin/python scripts/parity_lvis.py

      - name: Mask operations vs pycocotools.mask
        run: |
          source .venv/bin/activate
          .venv/bin/python scripts/parity_mask.py --cases 200

      # Frozen fixtures from the TensorFlow Object Detection API, the reference the
      # official Open Images protocol page points at. Checked in, so this needs
      # neither network nor TensorFlow — regenerate with `just gen-oid-fixtures`.
      - name: Open Images vs TensorFlow Object Detection API
        run: |
          source .venv/bin/activate
          .venv/bin/python scripts/parity_oid.py

      # Compares per-(image, category) matching *decisions* against pycocotools,
      # annotation by annotation, over a tracked corpus of 18 curated edge cases.
      # Metrics cannot replace this: two detections swapped between images can
      # leave AP identical to fifteen decimal places.
      - name: Matching decisions vs pycocotools
        run: |
          source .venv/bin/activate
          pytest scripts/test_adversarial.py -q

      - name: Type stubs track the extension module
        run: |
          source .venv/bin/activate
          pytest scripts/test_stubs.py -q

      - name: CLI surface
        run: |
          source .venv/bin/activate
          pytest scripts/test_cli.py -q

      - name: Plot theme contract
        run: |
          source .venv/bin/activate
          pytest scripts/test_theme.py -q
