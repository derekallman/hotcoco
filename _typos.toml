[files]
extend-exclude = [
    "data/",
    "*.json",
    "tests/fixtures/",
    # Minified bundles and font binaries: mangled identifiers and packed bytes,
    # ~850 hits between them. By extension, not by directory — `static/` also
    # holds our own dashboard.js/gallery.js/overlay.js/style.css, which excluding
    # the directory would take 3.5k lines of first-party code out of the check.
    "*.min.js",
    "*.ttf",
    # Same reasoning for the generated docs figures: a PNG's compressed bytes
    # decode as words often enough to bury the real hits. `docs/assets/` also
    # holds no text, but excluding by extension keeps the rule uniform with the
    # two above and survives a future .md landing beside the images.
    "*.png",
    "*.webp",
]

[default]
locale = "en-us"

[default.extend-words]
coco = "coco"
hotcoco = "hotcoco"
pycocotools = "pycocotools"
pyo = "pyo"
maturin = "maturin"
cdylib = "cdylib"
bbox = "bbox"
bboxes = "bboxes"
segm = "segm"
iou = "iou"
ious = "ious"
rle = "rle"
rles = "rles"
lvis = "lvis"
kpt = "kpt"
kpts = "kpts"
obb = "obb"
obbs = "obbs"
oks = "oks"
dts = "dts"
anns = "anns"
imgs = "imgs"
thr = "thr"
thrs = "thrs"
nms = "nms"
iscrowd = "iscrowd"
dota = "dota"
ded = "ded"
nd = "nd"
# Chart palette slot 6. A colour name, not a misspelling of "ocher" — the
# cyanotype skill, plot/theme.py, and dashboard.py all spell it this way.
ochre = "ochre"

# `extend-identifiers`, not `extend-words`: this still flags `fo` as a *sub-word*
# of a compound identifier, where `extend-words` would allowlist it everywhere.
# Prefer renaming over listing — everything else that tripped the checker was
# renamed instead: `ab`/`ba` -> `iou_fwd`/`iou_rev`, `hc_gti` -> `hc_gt_ignore`,
# `dog_anc` -> `dog_ancestors`, `mis-copied` -> `miscopied`.
[default.extend-identifiers]
fo = "fo"      # `import fiftyone as fo` — the library's own documented alias

# The CHANGELOG entry recording an earlier spelling pass quotes the British
# spellings it replaced; correcting them there yields `behavior` → `behavior`.
# Markdown-scoped, so the pattern cannot suppress a real typo in Rust or Python.
[type.md]
extend-ignore-re = ["American English spelling throughout \\([^)]*\\)"]
