[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "hotcoco"
version = "1.0.1"
description = "Perception evaluation toolkit — pycocotools-compatible detection metrics in pure Rust, up to 84× faster"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Derek Allman", email = "derek.allman@yahoo.com" }]
keywords = ["coco", "pycocotools", "object-detection", "evaluation", "computer-vision", "segmentation", "keypoints", "instance-segmentation", "perception", "model-evaluation"]
readme = "README.md"
dependencies = [
    "numpy>=1.22",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.12.6",
    "pycocotools",
    "faster-coco-eval",
    # The two other Rust evaluators scripts/bench.py compares against. Both are
    # optional there: a missing one leaves its column blank rather than failing
    # the run. vernier ships abi3 wheels for 3.10+ only.
    "ultrafast-pycocotools",
    "vernier; python_version >= '3.10'",
    "hypothesis",
    "lvis>=0.5.3",
    # Runs the hooks in .pre-commit-config.yaml, which pins the Ruff and typos
    # versions; the git hook and the py-* recipes call it through `uv run`.
    "pre-commit>=4",
    "psutil",
    "pytest",
    # Reference implementation for the OBB IoU fuzz harness
    # (tests/fuzz_obb.py), which could not run without it.
    "shapely>=2.0",
    # Reference implementation for scripts/parity_tide.py. Listed because its
    # absence used to make that script exit 0 after comparing against nothing,
    # so the TIDE gate silently passed while verifying no such thing.
    "tidecv>=1.0.1",
]
torch = [
    "torch>=1.9",
    "Pillow>=8.0",
]
completions = [
    "argcomplete>=3.0",
]
plot = [
    "matplotlib>=3.5",
]
browse = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "jinja2>=3.1",
    "Pillow>=8.0",
    "plotly>=5.0",
]

[project.urls]
Homepage = "https://derekallman.github.io/hotcoco/"
Repository = "https://github.com/derekallman/hotcoco"
Documentation = "https://derekallman.github.io/hotcoco/"
Changelog = "https://github.com/derekallman/hotcoco/releases"

[project.scripts]
coco = "hotcoco.cli:main"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
manifest-path = "crates/hotcoco-pyo3/Cargo.toml"
include = [{ path = "LICENSE", format = "sdist" }]

[tool.ruff]
line-length = 120
target-version = "py39"
# The notebook is prose with cells, not code under lint; excluding it lets every
# caller run ruff on `.` instead of naming the Python directories.
extend-exclude = ["external/", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
# Bare `pytest` collects the whole Python suite. The `fuzz_*.py` files beside it
# are not matched by the default `test_*.py` pattern, so they run only when named
# (`just fuzz`, `just fuzz-dropin`, `just fuzz-obb`): they take minutes and are
# for hunting bugs, not gating commits.
testpaths = ["tests"]
# `scripts/helpers.py` owns the shared dev helpers (data paths, keypoint
# constants, the metric comparison, `written_json`). The hand-run scripts import
# it from their own directory; the tests reach it through this entry, so there is
# one copy. Two tests also import the script whose oracle they check
# (`gen_oid_fixtures`, `gen_obb_fixtures`).
pythonpath = ["scripts"]

[tool.pyright]
# Scoped to the shipped package only. `scripts/` and `tests/` are untyped dev
# code and `external/` is vendored — checking any of them produces noise, not signal.
include = ["python"]
exclude = ["external", "scripts", "tests", ".venv", "target", "**/__pycache__"]
pythonVersion = "3.9"
typeCheckingMode = "basic"
# `hotcoco` is a compiled PyO3 extension; pyright resolves it through the venv
# that `just build` installs into, and types it from the hand-written
# python/hotcoco/__init__.pyi stub. This is what catches stub/API signature
# drift that tests/test_stubs.py can't see.
venvPath = "."
venv = ".venv"

[tool.uv]
package = false
