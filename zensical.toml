[project]
site_name = "hotcoco"
site_url = "https://derekallman.github.io/hotcoco/"
site_description = "Perception evaluation in pure Rust — pycocotools-compatible detection metrics up to 84× faster, plus diagnostics and dataset tools."
repo_url = "https://github.com/derekallman/hotcoco"
repo_name = "derekallman/hotcoco"
copyright = "MIT licensed"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quick start" = "getting-started/quickstart.md" },
    { "The COCO format" = "getting-started/coco-format.md" },
    { "Migrating from pycocotools" = "getting-started/migration.md" },
    { "Troubleshooting" = "getting-started/troubleshooting.md" },
  ] },
  { "User guide" = [
    { "Evaluation" = "guide/evaluation.md" },
    { "LVIS and Open Images" = "guide/lvis-open-images.md" },
    { "Model diagnostics" = "guide/diagnostics.md" },
    { "Dataset operations" = "guide/datasets.md" },
    { "Working with results" = "guide/results.md" },
    { "Mask operations" = "guide/masks.md" },
    { "PyTorch integration" = "guide/pytorch.md" },
    { "Plotting" = "guide/plotting.md" },
    { "Dataset browser" = "guide/browse.md" },
    { "Framework integrations" = "guide/frameworks.md" },
  ] },
  { "API reference" = [
    { "COCO" = "api/coco.md" },
    { "COCOeval" = "api/cocoeval.md" },
    { "Params" = "api/params.md" },
    { "metrics" = "api/metrics.md" },
    { "primitives" = "api/primitives.md" },
    { "mask" = "api/mask.md" },
    { "plot" = "api/plot.md" },
    { "Hierarchy" = "api/hierarchy.md" },
    { "PyTorch integrations" = "api/integrations.md" },
    { "CLI" = "cli.md" },
  ] },
  { "Benchmarks" = "benchmarks.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
icon.logo = "lucide/coffee"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.instant",
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.footer",
  "navigation.top",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[project.theme.font]
text = "IBM Plex Sans"
code = "IBM Plex Mono"

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.admonition]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.details]

# Footer links. Rendered by the theme's social partial into .md-footer-meta —
# without these the footer carries nothing but "Made with Zensical".
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/derekallman/hotcoco"
name = "hotcoco on GitHub"

[[project.extra.social]]
icon = "simple/pypi"
link = "https://pypi.org/project/hotcoco/"
name = "hotcoco on PyPI"

[[project.extra.social]]
icon = "simple/rust"
link = "https://crates.io/crates/hotcoco"
name = "hotcoco on crates.io"
